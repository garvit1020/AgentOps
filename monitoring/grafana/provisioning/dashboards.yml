apiVersion: 1

providers:
  - name: 'AgentOps Dashboards'
    orgId: 1
    folder: 'AgentOps'
    folderUid: 'agentops'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
