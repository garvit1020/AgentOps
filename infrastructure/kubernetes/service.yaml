---
apiVersion: v1
kind: Service
metadata:
  name: agentops-demo-app
  namespace: agentops
  labels:
    app: agentops-demo-app
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  selector:
    app: agentops-demo-app
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: agentops-backend
  namespace: agentops
  labels:
    app: agentops-backend
spec:
  selector:
    app: agentops-backend
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: agentops-agents
  namespace: agentops
  labels:
    app: agentops-agents
spec:
  selector:
    app: agentops-agents
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# LoadBalancer for external access (production)
apiVersion: v1
kind: Service
metadata:
  name: agentops-frontend-lb
  namespace: agentops
  labels:
    app: agentops-frontend
spec:
  selector:
    app: agentops-frontend
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
