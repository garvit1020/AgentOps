---
# ============================================================
# AgentOps Demo App - Kubernetes Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-demo-app
  namespace: agentops
  labels:
    app: agentops-demo-app
    version: "1.0.0"
    managed-by: agentops-platform
  annotations:
    agentops.io/deployed-by: "deployment-agent"
    agentops.io/pipeline-id: "auto"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentops-demo-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: agentops-demo-app
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: demo-app
          image: agentops-demo-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APP_NAME
              value: "AgentOps Demo App"
            - name: VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['version']
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# ============================================================
# AgentOps Backend - Kubernetes Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-backend
  namespace: agentops
  labels:
    app: agentops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentops-backend
  template:
    metadata:
      labels:
        app: agentops-backend
    spec:
      containers:
        - name: backend
          image: agentops-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: AGENT_SERVER_URL
              value: "http://agentops-agents:8000"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
          envFrom:
            - secretRef:
                name: agentops-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

---
# ============================================================
# AgentOps Python Agents - Kubernetes Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentops-agents
  namespace: agentops
  labels:
    app: agentops-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentops-agents
  template:
    metadata:
      labels:
        app: agentops-agents
    spec:
      containers:
        - name: agents
          image: agentops-agents:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: GROQ_MODEL
              value: "llama-3.1-70b-versatile"
            - name: GITHUB_REPO
              value: "garvit1020/AgentOps"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
          envFrom:
            - secretRef:
                name: agentops-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
