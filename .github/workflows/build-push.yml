name: AgentOps — Docker Build & Push

on:
  workflow_run:
    workflows: ["AgentOps CI — Code Analysis & Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (default: git SHA)'
        required: false

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/agentops

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    strategy:
      matrix:
        service:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: agents
            context: ./agents
            dockerfile: ./agents/Dockerfile
          - name: demo-app
            context: ./infrastructure/docker
            dockerfile: ./infrastructure/docker/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}

      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Notify AgentOps Platform
        if: always()
        run: |
          curl -X POST "${{ secrets.AGENTOPS_WEBHOOK_URL }}/api/webhook/github" \
            -H "Content-Type: application/json" \
            -d '{
              "event": "docker_push",
              "service": "${{ matrix.service.name }}",
              "image": "${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}",
              "tag": "${{ github.sha }}",
              "status": "${{ job.status }}",
              "repo": "${{ github.repository }}"
            }' || echo "AgentOps webhook not available"

  # Summary job
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    steps:
      - name: Post Build Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| backend  | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| agents   | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| demo-app | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
